name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m py_compile sync_all.py

      - name: Smoke test - menu starts and exits
        shell: bash
        run: printf '8\n' | python sync_all.py

      - name: Smoke test - incremental mode with no accounts
        shell: bash
        run: python sync_all.py --sync

      - name: Smoke test - full mode with unknown account
        shell: bash
        run: python sync_all.py --full --accounts nobody@example.com
