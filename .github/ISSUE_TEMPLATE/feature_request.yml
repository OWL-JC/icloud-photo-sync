name: Feature request
description: Suggest an idea for iCloud Photo Sync
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome!

        Note: "mirror phone deletions to disk" (`--auto-delete`) is already a
        known planned feature — you can still add details about how you would
        like it to behave.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or anything else that adds context.
    validations:
      required: false
